<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <title>Change Password</title>
    <style>
@import url(https://fonts.googleapis.com/css?family=Roboto:300,400);

*{
    margin: 0;
    padding: 0;
    font-family: Roboto;
    --aclc-color: #1a237e;
}

.Main-Content-wave {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    min-height: 100vh;
    background-color: #1a237e;
    font-family: Roboto;
    overflow: hidden;
}
.Main-Content-wave:before, .Main-Content-wave:after {
    content: "";
    position: absolute;
    left: 50%;
    min-width: 300vw;
    min-height: 300vw;
    background-color: #fbe9e7;
    animation-name: rotate;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

.Main-Content-wave:before {
    bottom: 15vh;
    border-radius: 45%;
    animation-duration: 10s;
}
.Main-Content-wave:after {
    bottom: 12vh;
    opacity: .5;
    border-radius: 47%;
    animation-duration: 10s;
}
@keyframes rotate {
    0% {transform: translate(-50%, 0) rotateZ(0deg);}
    50% {transform: translate(-50%, -2%) rotateZ(180deg);}
    100% {transform: translate(-50%, 0%) rotateZ(360deg);}
}
.Main-Content-wave * {
    z-index: 1;
}

.bg{
    background-image: url(loginphoto.jpg);
    background-size: cover; 
    background-position: center; 
}
.bg {
    border-radius: 10px 0 0 10px;
    height: 85vh;
}

body, html{
    width: 100%;
    height: 100%;
    margin: 0px;
    padding: 0px;
    overflow-x:hidden;
}

    </style>
<body>
  <div class="Main-Content-wave">
    <!--Change Password-->
    <div class="container">

        <!--Card-Panel-->
        <div class="card-panel no-padding z-depth-4" style="border-radius: 10px;">
            <div class="row">

                <!--Left-Column-->
                <div class="col s5 bg bg-login hide-on-med-and-down">
                    <div class="col s12 m12 l7 ">
                    
                    <img src="logo.png" class="responsive-img brand-logo left center-align" style="margin-top: 24px;">   
                    </div>
                </div>
                
                <!--Right-Column-->
                <div class="col s12 m12 l7 center-align" style="margin: 24px 0; padding: 0 96px 0 48px;">

                    <!--Form-->
                    <form action="">

                        <!--Change Password-->
                        <div class="row">
                            <h5 class=" text-align:center;">Change Password</h5>
                        </div>

                          <!--Current-Password-->
                       <div class="row">
                            <div class="col s12" style="margin-top: 0;">
                               <div class="input-field">
                                <i class="fa-solid fa-lock prefix"></i>
                                <input id="Current Password" type="Password" class="validate" required>
                                <label class="active" for="Current Password">Current Password</label>
                               </div>
                            </div>
                        </div>

                        <!--New-Password-->
                        <div class="row">
                                <div class="col s12" style="margin-top: 0;">
                                   <div class="input-field">
                                    <i class="fa-solid fa-lock prefix"></i>
                                    <input id="New Password" type="Password" class="validate" required>
                                    <label class="active" for=" New password">New Password</label>
                                </div>
                            </div>
                        </div>
                        
                           <!--Re-type-NewPassword-->
                           <div class="row">
                            <div class="col s12" style="margin-top: 0;">
                                <div class="input-field">
                                    <i class="fa-solid fa-lock prefix"></i>
                                    <input id="Re-type Password" type="Password" class="validate" required>
                                    <label class="active" for="Re-type Password"> Re-type New Password</label>
                                </div>
                            </div>
                        </div>

                     <!--changepass button -->
                    <div class="row">
                       <div class="col s12 m8">
                         <button class="btn waves-effect indigo darken-7 waves-light btn-small" type="submit" name="action">Change Password
                         </button>
                       </div> 
                    </div>

                    <div class="row">
                        <div class="col s12 m12 " style="text-align: right;">
                            <a href="#">Forgot Password?</a>
                        </div>
                    </div>

                    </div>
                </div>
            </div> 
        </div>
    </div>
</div>    

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
